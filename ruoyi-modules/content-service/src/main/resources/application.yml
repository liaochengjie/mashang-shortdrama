# Tomcat
server:
  port: 10001

# Spring
spring:
  application:
    # 应用名称
    name: content-service
  profiles:
    # 环境配置
    active: @profiles.active@
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 100MB
      enabled: on
--- # nacos 配置
spring:
  cloud:
    nacos:
      # nacos 服务地址
      server-addr: @nacos.server@
      username: @nacos.username@
      password: ${SPRING_CLOUD_NACOS_PASSWORD}
      discovery:
        # 注册组
        group: @nacos.discovery.group@
        namespace: ${spring.profiles.active}
      config:
        # 配置组
        group: @nacos.config.group@
        namespace: ${spring.profiles.active}
  config:
    import:
      - optional:nacos:application-common.yml
      - optional:nacos:datasource.yml
      - optional:nacos:${spring.application.name}.yml


myMinio:
  endpoint: http://localhost:9000
  accessKey: ${MYMINIO_ACCESSKEY}
  secretKey: ${MYMINIO_SECRETKEY}

vod:
  secretId: ${VOD_SECRETID}
  secretKey: ${VOD_SECRETKEY}
  stuAppId: 1500043826
  region: ap-guangzhou
---
spring:
  ai:
    deepseek:
      api-key: ${SPRING_AI_DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        options:
          temperature: 0.7
          #温度影响大模型的随机生成程度

    dashscope:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-72b-instruct
          temperature: 0.7
      image:
        options:
          model: qwen-image
          n: 1
          width: 1920
          height: 1080
      workspace-id: llm-ce5uvrrh5pxab6bp


---
spring:
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      url: https://api.xty.app
      chat:
        options:
          model: gpt4
---
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD}
      database: 1
