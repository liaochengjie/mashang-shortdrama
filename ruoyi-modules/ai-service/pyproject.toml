[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kcat-ai-service"
version = "0.1.0"
description = "Kcat AI service built with Python, LangChain and LangGraph"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_service*"]
